[project]
name = "sfcm-engine"
version = "0.1.0"
description = "Engine for SFCM for Anki: Anki I/O, LLM calls, document parsing and jobs."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1,<2",
    "openai>=1.50,<3",
    "pydantic>=2.9,<3",
    "jinja2>=3.1,<4",
]

[project.scripts]
sfcm-engine = "sfcm_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pyinstaller>=6.11",
    "pip-licenses>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfcm_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Makes the repo-level `evals` package importable from tests.
pythonpath = [".."]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
