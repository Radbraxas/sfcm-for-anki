# cargo-deny: license and advisory checks for Rust crates (roadmap A02, A05).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each entry needs a reason and should be revisited when Tauri updates its GTK stack.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained, not vulnerable; pulled in by Tauri's Linux GTK bindings (glib-macros), no upgrade available" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "Unicode-3.0", "Unicode-DFS-2016",
    "MPL-2.0", "CC0-1.0", "BSL-1.0", "CDLA-Permissive-2.0", "OpenSSL",
    "LGPL-2.1-or-later", "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
