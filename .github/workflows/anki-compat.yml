name: Anki compatibility

# Tests the engine against the newest `anki` release, so a format change is caught
# before we bump the pin (roadmap A15). Opens an issue when it fails.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  latest-anki:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v2
      - name: Install with the newest anki release
        id: anki
        run: |
          uv sync --project engine --locked
          uv pip install --python engine/.venv --upgrade anki
          echo "version=$(engine/.venv/bin/python -c 'import importlib.metadata as m; print(m.version("anki"))')" >> "$GITHUB_OUTPUT"
      - name: Engine tests
        run: engine/.venv/bin/python -m pytest -c engine/pyproject.toml engine/tests evals/tests
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Engine tests fail with anki ${{ steps.anki.outputs.version }}" \
            --label bug --label epic:anki-core \
            --body "The weekly Anki compatibility run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Keep the current pin until this is fixed (see docs/anki-compat.md)."
