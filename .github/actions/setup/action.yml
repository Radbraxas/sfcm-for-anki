name: Set up toolchains
description: Rust, uv/Python, Node/pnpm, just, and Linux system libraries for Tauri.
runs:
  using: composite
  steps:
    - name: Linux system libraries (Tauri, keychain)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libssl-dev libdbus-1-dev pkg-config build-essential patchelf file
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - uses: extractions/setup-just@v2
    - name: Install dependencies
      shell: bash
      run: |
        uv sync --project engine --locked
        pnpm install --frozen-lockfile
